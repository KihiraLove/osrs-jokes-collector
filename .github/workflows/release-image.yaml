name: Publish release image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag on main (matches package.json)
        required: true
        type: string
      local_checks_passed:
        description: Local full suite and Compose checks passed for this exact tag
        required: true
        default: false
        type: boolean

permissions: {}
concurrency:
  group: collector-release-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve approved version tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          LOCAL_CHECKS_PASSED: ${{ inputs.local_checks_passed }}
        run: node scripts/release-policy.mjs
      - name: Check out the approved release commit
        env:
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: git checkout --detach "$RELEASE_REVISION"
      - name: Set up image builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in with the built-in workflow token
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/KihiraLove/osrs-jokes-collector
            org.opencontainers.image.licenses=BSD-2-Clause
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
      - name: Record deployment digest
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf 'Published `%s:%s`\n\n' "$RELEASE_IMAGE" "$RELEASE_TAG"
            printf 'Deploy/record: `%s@%s`\n\n' "$RELEASE_IMAGE" "$IMAGE_DIGEST"
            printf 'First publication: set the GHCR package visibility to Public, then verify an anonymous pull. See docs/releases.md.\n'
          } >> "$GITHUB_STEP_SUMMARY"
